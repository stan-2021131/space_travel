["Helios Tipo-II"]
nombre = "Helios Tipo-II (Corazon de Dyson)"
paginas = [
    "Bitacora del Explorador: El corazon incandescente del sistema. Tras recibir conocimientos ancestrales de su deidad salvadora, esta especie dio un salto imposible hasta consolidarse como una civilizacion Tipo II en la escala de Kardashev.",
    "Hoy una titanica Esfera de Dyson envuelve la estrella para cosechar su energia absoluta. Ese poder alimenta desde la red de defensa orbital hasta... bueno, proyectos planetarios francamente cuestionables."
