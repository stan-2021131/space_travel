["Cenotafio Cero"]
nombre = "Cuna Fracturada (Cenotafio Cero)"
paginas = [
    "Planeta de origen donde esta civilizacion dio sus primeros pasos. Fue partido por un asteroide colosal imposible de frenar con su antigua tecnologia; sobrevivieron solo gracias al aviso previo de un ente espacial al que acabaron nombrando su dios.",
    "Lejos de quedar en el olvido, el impacto expuso vetas minerales ultradensas en su nucleo abierto. Hoy sirve al mismo tiempo como santuario conmemorativo y cantera estrategica de cristales geotermicos entre sus escombros."
]

["Forja Basaltica"]
nombre = "Forja Basaltica (Yunque Solar)"
paginas = [
    "Abrasado por su cercania extrema al Sol, este mundo arido resulta letal para la vida organica. Sin embargo, sus profundos canones esconden los metales pesados indispensables para construir naves y anillos de la Esfera de Dyson.",
    "Los ingenieros aprovecharon el calor estelar implacable para transformar su cara diurna en una gigantesca fundicion a cielo abierto. Todo el blindaje de la flota patrullera nace forjado entre estas cordilleras basalticas."
]

["Eden Replicado"]
nombre = "Eden Replicado (Eco del Hogar)"
paginas = [
    "Tras escapar del asteroide, la especie construyo una replica exacta de su mundo natal perdido. El paisaje alterna bosques ordenados de robles y pinos con ciudades tranquilas, casas familiares y fabricas limpias bajo un cielo calibrado.",
    "La vida aqui transcurre en una rutina pacifica casi irreal. Aun asi, los ancianos admiten una extrana nostalgia al pasear por colinas identicas a las originales, sabiendo que todo su horizonte fue reconstruido a partir de archivos."
]

["Parque kirby"]
nombre = "Parque kirby (Ultimo Refugio)"
paginas = [
    "Mas del 80% de la poblacion murio en el desastre del asteroide. La mayoria de los sobrevivientes pertenecia a la clase alta, acostumbrada al lujo y al ocio, por lo que terminaron dedicando un planeta entero al entretenimiento.",
    "En el centro se alza una colosal estatua rosada en honor a su dios salvador, vigilada por una luna en forma de estrella. El contraste entre la fe devota y el ambiente de parque tematico sigue descolocando mis registros.",
    "Por si otro asteroide llegara a amenazarlos, instalaron un propulsor gigante bajo la base del santuario para poder despegar con toda la fiesta a cuestas. Debo admitir que la prevencion de la elite es... peculiar."
]

["Anillo Glaseado"]
nombre = "Anillo Glaseado (Sector Confiteria)"
paginas = [
    "Debo mantener el profesionalismo en este informe, aunque la vista no ayude. Al intentar perfeccionar su tecnologia de terraformacion, un calculo fallido remodelo todo el planeta en una descomunal dona glaseada.",
    "En lugar de corregirlo, aprovecharon el accidente y lo convirtieron en el mayor centro de produccion alimentaria del sistema. Ahora su superficie abastece al cuadrante entero de pasteles, galletas, helados y paletas monumentales."
]

[Homero]
